name: Eval (manual)

# Manual-only (plus an optional weekly run): this exercises the real agent
# against live Groq (and Anthropic, if configured), burning real API tokens
# and subject to Groq's free-tier rate limit. Keep this separate from the
# free, mocked pytest suite in ci.yml, which runs on every push/PR.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run eval harness
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python eval/eval_runner.py
