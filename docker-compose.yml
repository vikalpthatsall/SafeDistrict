version: "3.9"

services:
  backend:
    build: .  # untested — see the caveat at the top of Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      ALLOWED_ORIGINS: "http://localhost:8501"

  frontend:
    build: .
    command: ["streamlit", "run", "frontend/app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      BACKEND_URL: "http://backend:8000"
    depends_on:
      - backend
